# Render Blueprint: creates the web service and its PostgreSQL database in one go.
# In Render: New > Blueprint > pick your GitHub repository. You'll be asked for the secret values.
services:
  - type: web
    name: kwacha-books
    runtime: python
    plan: starter            # always on. "free" works for testing but sleeps after 15 minutes idle.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: kwacha-db
          property: connectionString
      - key: TASK_TOKEN
        generateValue: true  # Render makes a random secret; copy it for the scheduler
      - key: WA_TOKEN
        sync: false          # you paste these in when creating the Blueprint
      - key: WA_PHONE_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: ALLOWED_NUMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: BUSINESS_NAME
        value: Kwacha Books
      - key: BOT_TIMEZONE
        value: Africa/Lusaka
      - key: WA_GRAPH_VERSION
        value: v26.0
      - key: WA_SUMMARY_TEMPLATE
        value: daily_summary

databases:
  - name: kwacha-db
    plan: basic-256mb        # "free" works for testing but is deleted after 30 days
    databaseName: kwacha
